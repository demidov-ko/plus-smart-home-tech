spring:
  application:
    name: analyzer
  datasource:
    url: jdbc:postgresql://localhost:5433/telemetry_analyzer
    username: dbuser
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

kafka:
  bootstrap-servers: localhost:9092
  consumer:
    hub-events-group-id: analyzer-hub-events
    snapshots-group-id: analyzer-snapshots
    auto-offset-reset: earliest
    enable-auto-commit: false
  topics:
    hubs: telemetry.hubs.v1
    snapshots: telemetry.snapshots.v1

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.hibernate: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.orm: DEBUG